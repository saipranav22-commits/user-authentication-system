spring:
  application:
    name: auth-system

  datasource:
    # Externalized datasource configuration supporting MySQL, Neon PostgreSQL, and H2
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

  jpa:
    # Hibernate automatically selects dialect based on JDBC driver metadata (MySQL / PostgreSQL / H2)
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Ensure Jackson formats output dates cleanly in ISO-8601
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always # Ensure detailed validation error messages are sent

security:
  jwt:
    # 256-bit signing key loaded securely from environment variable (SEC-03)
    secret-key: ${JWT_SECRET:default-local-dev-jwt-secret-key-must-be-32-bytes-minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

app:
  # Demo mode disabled by default; set to true explicitly if token inspection is needed for local development
  demo-mode: ${APP_DEMO_MODE:false}
  cors:
    # Restrictive CORS: empty by default because frontend is served on the same origin
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Production logging settings: Do not log SQL bind parameters or sensitive authorization details
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
