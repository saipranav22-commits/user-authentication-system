# Strict Production Profile Configuration for Cloud Deployment
# Enforces mandatory environment variables without localhost or H2 fallbacks
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

app:
  demo-mode: ${APP_DEMO_MODE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
